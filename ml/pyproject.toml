[project]
name = "pulsetrader"
version = "0.1.0"
description = "PulseTrader V4 ML pipeline: data, features, labels, splits, models, evaluation"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
dl = ["torch>=2.2"]
fetch = ["huggingface_hub>=0.23"]

[project.scripts]
pulsetrader = "pulsetrader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S110"]
# BLE: blind except; S110: try/except/pass. Both banned by spec section 68.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
