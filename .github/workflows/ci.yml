name: ci
on: [push, pull_request]
jobs:
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,serve]"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -U "setuptools>=83"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
      - run: pip install pip-audit && pip-audit
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: pulsetrader_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulsetrader_unused
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/pulsetrader_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      # the migrations must produce exactly schema.prisma (no unmigrated schema change)
      - run: PGPASSWORD=ci psql -h localhost -U ci -d pulsetrader_test -c 'CREATE DATABASE pulsetrader_shadow'
      - run: >-
          npx prisma migrate diff --exit-code --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://ci:ci@localhost:5432/pulsetrader_shadow
      - run: npm audit --omit=dev --audit-level=moderate
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      # browser e2e (e2e/) needs the full stack with the real dataset and model artifacts, which CI
      # does not have; it runs locally, see docs/frontend.md
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # builds the ml, api and web images, starts the compose stack, waits for every health check and
      # checks it end to end through the web app (scripts/hardening/compose_smoke.sh)
      - run: bash scripts/hardening/compose_smoke.sh
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: secret scan (full git history)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact -v
      - name: workflow lint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color
