services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsetrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pulsetrader
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrader"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  ml-service:
    build: ./ml
    environment:
      PULSETRADER_DATA_DIR: /data
      PULSETRADER_DATASET: core100_s5
    volumes:
      - ./data/registry:/data/registry:ro
      - ./data/datasets:/data/datasets:ro
      - ./data/canonical:/data/canonical:ro   # minute bars + indicators for the dashboard
      - ./data/reference:/data/reference:ro   # daily index bars (market regime)
    ports: ["8000:8000"]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://pulsetrader:${POSTGRES_PASSWORD}@postgres:5432/pulsetrader
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 1   # requests arrive through the web app's same-origin proxy
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_started }
    ports: ["3001:3001"]
  web:
    build: ./web
    environment:
      API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
volumes:
  pgdata:
